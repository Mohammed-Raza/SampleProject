name: Flutter End to End

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.41.9'

      - name: Get pub dependencies
        run: flutter pub get

      - name: Check code format
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build_android:
    runs-on: ubuntu-latest
    needs: lint_and_test # This job depends on lint_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.41.9'

      - name: Get pub dependencies
        run: flutter pub get

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: flutter build apk --flavor farmersMarket

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/app-farmersMarket-release.apk

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/app/outputs/flutter-apk/
          publish_branch: gh-pages